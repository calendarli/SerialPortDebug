appId: com.serialflow.desktop
productName: SerialFlow
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: driver/SerialFlowVirtualSerial/Manager/x64/Release/SerialFlowVirtualSerialManager.exe
    to: virtual-serial/SerialFlowVirtualSerialManager.exe
  - from: driver/SerialFlowVirtualSerial/ComPort/x64/Debug/VirtualSerial2um
    to: virtual-serial
  - from: driver/SerialFlowVirtualSerial/ComPort/x64/Debug/SerialFlowVirtualSerial.cer
    to: virtual-serial/SerialFlowVirtualSerial.cer
win:
  executableName: SerialFlow
  icon: build/icon-v3.ico
  target:
    - nsis
nsis:
  artifactName: SerialFlow-${version}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - zh_CN
  displayLanguageSelector: false
  installerIcon: build/icon-v3.ico
  uninstallerIcon: build/icon-v3.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
mac:
  icon: build/icon-v3.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
